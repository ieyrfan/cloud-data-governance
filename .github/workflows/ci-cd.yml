name: Enterprise Cloud Security CI/CD Pipeline

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  security-and-testing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            deployment/lambda-requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Pytest (Unit Testing)
        run: |
          export PYTHONPATH=src
          pytest --cov=src --cov-report=term-missing --cov-fail-under=30 tests/

      - name: Lint Python
        run: ruff check src scripts tests

      - name: Scan Python code for high-confidence security issues
        run: bandit -q -r src scripts -x tests -ll

      - name: Audit deployed Python dependencies
        run: pip-audit -r deployment/lambda-requirements.txt

      - name: Validate Learner Lab CloudFormation
        run: cfn-lint cloudformation/learner-lab.yml

      - name: Validate dashboard JavaScript
        run: node --check frontend/static/app.js

      - name: Terraform Format Check
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - run: terraform fmt -check -recursive
        working-directory: ./terraform

      - name: Infrastructure Security Scan (tfsec)
        uses: aquasecurity/tfsec-action@b466648d6e39e7c75324f25d83891162a721f2d6 # v1.0.3
        with:
          working_directory: ./terraform
          soft_fail: false

