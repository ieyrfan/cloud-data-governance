[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv", ".gstack", "**/__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "BLE", "DTZ", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"

[tool.coverage.run]
source = ["src"]
omit = ["src/**/__pycache__/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
