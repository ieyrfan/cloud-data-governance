AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Optional separately governed DataSentinel audit-checkpoint boundary. Deploy
  this stack in a security boundary separate from the application account.

Parameters:
  ProjectName:
    Type: String
    Default: datasentinel
    AllowedPattern: "^[a-z0-9-]{3,32}$"

Resources:
  AnchorKey:
    Type: AWS::KMS::Key
    Properties:
      Description: Encrypts DataSentinel audit checkpoint objects.
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: EnableAccountAdministration
            Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"

  AnchorBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${ProjectName}-audit-anchor-${AWS::AccountId}-${AWS::Region}"
      ObjectLockEnabled: true
      ObjectLockConfiguration:
        ObjectLockEnabled: Enabled
        Rule:
          DefaultRetention:
            Mode: COMPLIANCE
            Days: 365
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !Ref AnchorKey
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  AnchorBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AnchorBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt AnchorBucket.Arn
              - !Sub "${AnchorBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

Outputs:
  AnchorBucketName:
    Value: !Ref AnchorBucket
  AnchorKeyArn:
    Value: !GetAtt AnchorKey.Arn
  ControlStatus:
    Value: ACTIVE_WHEN_APPLICATION_PUBLISHES_TO_THIS_BUCKET

